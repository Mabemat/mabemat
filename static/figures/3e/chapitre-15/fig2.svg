<svg viewBox="0 0 780 250" xmlns="http://www.w3.org/2000/svg"
     font-family="'DM Sans', sans-serif" font-size="12">

  <!-- ── Axis ── -->
  <defs>
    <marker id="axarrow" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <line x1="62" y1="200" x2="700" y2="200"
        stroke="#555" stroke-width="1" marker-end="url(#axarrow)"/>

  <!-- Axis ticks and labels -->
  <line x1="95" y1="194" x2="95" y2="205" stroke="#555" stroke-width="0.7"/>
  <text x="95" y="220" text-anchor="middle" fill="#555">5</text>
  <line x1="160" y1="194" x2="160" y2="205" stroke="#555" stroke-width="0.7"/>
  <text x="160" y="220" text-anchor="middle" fill="#555">10</text>
  <line x1="225" y1="194" x2="225" y2="205" stroke="#555" stroke-width="0.7"/>
  <text x="225" y="220" text-anchor="middle" fill="#555">15</text>
  <line x1="290" y1="194" x2="290" y2="205" stroke="#555" stroke-width="0.7"/>
  <text x="290" y="220" text-anchor="middle" fill="#555">20</text>
  <line x1="355" y1="194" x2="355" y2="205" stroke="#555" stroke-width="0.7"/>
  <text x="355" y="220" text-anchor="middle" fill="#555">25</text>
  <line x1="420" y1="194" x2="420" y2="205" stroke="#555" stroke-width="0.7"/>
  <text x="420" y="220" text-anchor="middle" fill="#555">30</text>
  <line x1="485" y1="194" x2="485" y2="205" stroke="#555" stroke-width="0.7"/>
  <text x="485" y="220" text-anchor="middle" fill="#555">35</text>
  <line x1="550" y1="194" x2="550" y2="205" stroke="#555" stroke-width="0.7"/>
  <text x="550" y="220" text-anchor="middle" fill="#555">40</text>
  <line x1="615" y1="194" x2="615" y2="205" stroke="#555" stroke-width="0.7"/>
  <text x="615" y="220" text-anchor="middle" fill="#555">45</text>
  <text x="667" y="220" text-anchor="start" fill="#555">(min)</text>

  <!-- ── 3e boxplot ── -->
  <!-- Box -->
  <rect x="160" y="24" width="130" height="91"
        fill="#E1957A" fill-opacity="0.15" stroke="#E1957A" stroke-width="1.5"/>
  <!-- Median -->
  <line x1="225" y1="24" x2="225" y2="115"
        stroke="#9C7487" stroke-width="2.5"/>
  <!-- Left whisker + min cap -->
  <line x1="95" y1="70" x2="160" y2="70"
        stroke="#E1957A" stroke-width="1.5"/>
  <line x1="95" y1="24" x2="95" y2="115"
        stroke="#E1957A" stroke-width="1.5"/>
  <!-- Right whisker + max cap -->
  <line x1="290" y1="70" x2="615" y2="70"
        stroke="#E1957A" stroke-width="1.5"/>
  <line x1="615" y1="24" x2="615" y2="115"
        stroke="#E1957A" stroke-width="1.5"/>
  <!-- Label "3e" -->
  <text x="66" y="74" text-anchor="end"
        fill="#E1957A" font-weight="bold">3&#x1D49;</text>

  <!-- ── 4e boxplot ── -->
  <!-- Box -->
  <rect x="225" y="134" width="130" height="52"
        fill="#A4485F" fill-opacity="0.15" stroke="#A4485F" stroke-width="1.5"/>
  <!-- Median -->
  <line x1="290" y1="134" x2="290" y2="186"
        stroke="#9C7487" stroke-width="2.5"/>
  <!-- Left whisker + min cap -->
  <line x1="95" y1="160" x2="225" y2="160"
        stroke="#A4485F" stroke-width="1.5"/>
  <line x1="95" y1="134" x2="95" y2="186"
        stroke="#A4485F" stroke-width="1.5"/>
  <!-- Right whisker + max cap -->
  <line x1="355" y1="160" x2="550" y2="160"
        stroke="#A4485F" stroke-width="1.5"/>
  <line x1="550" y1="134" x2="550" y2="186"
        stroke="#A4485F" stroke-width="1.5"/>
  <!-- Label "4e" -->
  <text x="66" y="164" text-anchor="end"
        fill="#A4485F" font-weight="bold">4&#x1D49;</text>

</svg>