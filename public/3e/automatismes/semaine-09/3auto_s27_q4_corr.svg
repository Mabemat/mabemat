<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="270.0" height="242.9"
     viewBox="0 0 270.0 242.9">
<style>
  text { font-family: "Latin Modern Math","STIX Two Math","Times New Roman",serif;
          font-size: 13px; fill: #2D2226; }
  .lbl { font-style: italic; }
  .dim { font-size: 11px; }
  .rep { fill: #EB7F73; font-weight: bold; font-style: italic; }
</style>

<!-- Triangle TUV -->
<polygon points="190.00,162.92 65.00,162.92 65.00,80.00"
         fill="none" stroke="#2D2226" stroke-width="1.2"/>

<!-- Right angle at U -->
<path d="M 73.00,162.92 L 73.00,154.92 L 65.00,154.92" fill="none" stroke="#2D2226" stroke-width="0.8"/>

<!-- 1 tick on [OT] and [OV] → O milieu de [TV] -->
<path d="M 155.99,146.35 L 161.51,138.02" fill="none" stroke="#2D2226" stroke-width="1.2"/>
<path d="M 99.01,96.56 L 93.49,104.90" fill="none" stroke="#2D2226" stroke-width="1.2"/>

<!-- Circumscribed circle -->
<circle cx="127.50" cy="121.46" r="75.00"
        fill="none" stroke="#EB7F73" stroke-width="1.2" stroke-dasharray="5,3"/>

<!-- Center O -->
<circle cx="127.50" cy="121.46" r="2.5" fill="#EB7F73"/>

<!-- Labels -->
<text x="196.0"  y="167.9"  class="lbl">T</text>
<text x="48.0" y="167.9"  class="lbl">U</text>
<text x="48.0" y="85.0"  class="lbl">V</text>
<text x="133.5"  y="116.5"  class="rep">O</text>

<!-- Dimensions -->
<text x="127.5" y="176.9" class="dim" text-anchor="middle">5 cm</text>
<text x="136.3" y="108.1" class="dim" text-anchor="middle">6 cm</text>
</svg>