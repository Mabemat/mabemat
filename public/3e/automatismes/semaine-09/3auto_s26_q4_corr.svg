<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="279.1" height="226.0"
     viewBox="0 0 279.1 226.0">
<style>
  text { font-family: "Latin Modern Math","STIX Two Math","Times New Roman",serif;
          font-size: 13px; fill: #2D2226; }
  .lbl { font-style: italic; }
  .dim { font-size: 11px; }
  .rep { fill: #EB7F73; font-weight: bold; font-style: italic; }
</style>

<!-- Triangle -->
<polygon points="199.14,146.00 60.00,80.00 60.00,146.00"
         fill="none" stroke="#2D2226" stroke-width="1.2"/>

<!-- Right angle at W -->
<path d="M 60.00,138.00 L 68.00,138.00 L 68.00,146.00" fill="none" stroke="#2D2226" stroke-width="0.8"/>

<!-- 1 tick on [OV] and [OU] → O est milieu de [UV] -->
<path d="M 96.93,91.98 L 92.64,101.02" fill="none" stroke="#2D2226" stroke-width="1.2"/>
<path d="M 162.21,134.02 L 166.50,124.98" fill="none" stroke="#2D2226" stroke-width="1.2"/>

<!-- Circumscribed circle -->
<circle cx="129.57" cy="113.00" r="77.00"
        fill="none" stroke="#EB7F73" stroke-width="1.2" stroke-dasharray="5,3"/>

<!-- Center O dot -->
<circle cx="129.57" cy="113.00" r="2.5" fill="#EB7F73"/>

<!-- Labels -->
<text x="43.0" y="151.0"  class="lbl">W</text>
<text x="43.0" y="85.0"  class="lbl">V</text>
<text x="205.1"  y="151.0"  class="lbl">U</text>
<text x="135.6"  y="108.0"  class="rep">O</text>

<!-- Dimensions -->
<text x="76.0" y="113.0" class="dim" text-anchor="middle">3 cm</text>
<text x="122.7" y="127.5" class="dim" text-anchor="middle">7 cm</text>
</svg>