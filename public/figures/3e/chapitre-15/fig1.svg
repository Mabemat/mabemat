<svg viewBox="0 0 680 205" xmlns="http://www.w3.org/2000/svg"
     font-family="'DM Sans', sans-serif" font-size="13">
  <defs>
    <marker id="ah1" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#573652"/>
    </marker>
  </defs>

  <!-- Box (Couleur8, fill 15%) -->
  <rect x="170" y="77.0" width="240" height="66.0"
        fill="#E1957A" fill-opacity="0.15" stroke="#E1957A" stroke-width="1.5"/>

  <!-- Median line (Couleur3, thick) -->
  <line x1="290" y1="77.0" x2="290" y2="143.0"
        stroke="#9C7487" stroke-width="2.5"/>

  <!-- Left whisker -->
  <line x1="50" y1="110" x2="170" y2="110"
        stroke="#E1957A" stroke-width="1.5"/>
  <!-- Right whisker -->
  <line x1="410" y1="110" x2="590" y2="110"
        stroke="#E1957A" stroke-width="1.5"/>

  <!-- Min cap -->
  <line x1="50" y1="86.0" x2="50" y2="134.0"
        stroke="#E1957A" stroke-width="1.5"/>
  <!-- Max cap -->
  <line x1="590" y1="86.0" x2="590" y2="134.0"
        stroke="#E1957A" stroke-width="1.5"/>

  <!-- Labels above -->
  <text x="50" y="65.0" text-anchor="middle" fill="#E1957A">min</text>
  <text x="170"  y="65.0" text-anchor="middle" fill="#E1957A">Q&#x2081;</text>
  <text x="290"   y="65.0" text-anchor="middle" fill="#A4485F" font-style="italic">M</text>
  <text x="410"  y="65.0" text-anchor="middle" fill="#E1957A">Q&#x2083;</text>
  <text x="590" y="65.0" text-anchor="middle" fill="#E1957A">max</text>

  <!-- IQR double-headed arrow -->
  <line x1="170" y1="170" x2="410" y2="170"
        stroke="#573652" stroke-width="1"
        marker-start="url(#ah1)" marker-end="url(#ah1)"/>
  <text x="290" y="188"
        text-anchor="middle" fill="#573652" font-size="12">&#xe9;cart interquartile</text>
</svg>